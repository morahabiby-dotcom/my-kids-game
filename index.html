<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atinuke Book Club — Theme &amp; Character Challenge</title>
<style>
  :root{
    --wood:#5b3a29;
    --wood-dark:#3e271b;
    --cream:#fff8ec;
    --orange:#e8770f;
    --orange-dark:#bd5e0c;
    --teal:#1f8a83;
    --pink:#c9436b;
    --gold:#e8b64a;
    --ink:#2a2320;
    --line:#c8a97e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
    color:var(--cream);
  }
  .wrap{
    max-width:740px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 16px 40px;
  }
  h1{
    font-size:clamp(20px,5vw,28px); margin:4px 0 2px; text-align:center; color:var(--gold);
    text-shadow:2px 2px 0 rgba(0,0,0,0.35);
  }
  .subtitle{ color:#ecdcc4; font-size:14px; margin-bottom:14px; text-align:center; }

  .hud{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.08); border:2px solid var(--line); border-radius:14px;
    padding:10px 16px; margin-bottom:14px; font-weight:600;
  }
  .hud .score{ color:var(--gold); font-size:14px; }
  .hud .badges{ font-size:16px; letter-spacing:2px; }

  .progress-bar{ width:100%; height:8px; background:rgba(255,255,255,0.15); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--orange),var(--gold)); width:0%; transition:width .4s ease; }

  /* Bookshelf scene */
  .shelf{
    position:relative; width:100%; height:110px; border-radius:14px; overflow:hidden;
    margin-bottom:18px; border:3px solid var(--wood-dark);
    background: repeating-linear-gradient(180deg, #8a5a3c 0 8px, #7a4d33 8px 92px);
    display:flex; align-items:flex-end; justify-content:center; gap:6px; padding:0 10px 10px;
  }
  .book{
    width:26px; height:70px; border-radius:3px 3px 0 0;
    display:flex; align-items:flex-end; justify-content:center;
    font-size:10px; font-weight:800; color:white; padding-bottom:4px;
    box-shadow: inset -3px 0 0 rgba(0,0,0,0.15);
    transition: transform 0.2s ease;
  }
  .book.lit{ transform: translateY(-8px); box-shadow: 0 0 0 3px var(--gold); }
  .status-msg{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); padding:4px 12px; border-radius:20px;
    font-size:12px; font-weight:700; color:var(--gold); white-space:nowrap;
  }

  .card{
    width:100%; background:var(--cream); color:var(--ink); border-radius:18px;
    padding:22px 20px 18px; box-shadow:0 10px 0 rgba(0,0,0,0.3); position:relative;
  }
  .prompt-label{
    font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--orange-dark); margin-bottom:8px;
  }
  .question{ font-size:clamp(18px,5vw,21px); font-weight:800; margin-bottom:14px; line-height:1.35; }
  .hint-text{ font-size:13px; color:#6b6156; font-style:italic; margin-bottom:12px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px){ .options{ grid-template-columns:1fr; } }
  .opt{
    background:white; border:3px solid #e4d9c8; border-radius:12px; padding:13px 10px;
    font-size:15px; font-weight:700; cursor:pointer; color:var(--ink); transition:all .15s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--orange); transform:translateY(-2px); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--teal); border-color:var(--teal); color:white; }
  .opt.wrong{ background:var(--pink); border-color:var(--pink); color:white; }

  .multi-note{ font-size:12.5px; color:#6b6156; margin-bottom:10px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{
    background:white; border:3px solid #e4d9c8; border-radius:24px; padding:9px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; color:var(--ink); transition:all .15s ease;
  }
  .chip.selected{ background:var(--gold); border-color:var(--orange-dark); }
  .chip.locked-correct{ background:var(--teal); color:white; border-color:var(--teal); }
  .chip.locked-wrong{ background:var(--pink); color:white; border-color:var(--pink); }

  .feedback{ min-height:24px; margin-top:10px; font-weight:700; font-size:14px; text-align:center; }
  .feedback.good{ color:#12695f; }
  .feedback.bad{ color:#a12d4a; }

  .action-btn{
    display:block; margin:14px auto 0; background:var(--orange); color:white; border:none;
    border-radius:30px; padding:10px 26px; font-size:15px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 0 var(--orange-dark);
  }
  .action-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--orange-dark); }

  .end-screen{
    width:100%; background:var(--cream); color:var(--ink); border-radius:18px; padding:34px 22px;
    text-align:center; box-shadow:0 10px 0 rgba(0,0,0,0.3);
  }
  .end-screen h2{ margin-top:0; font-size:24px; color:var(--orange-dark); }
  .end-emoji{ font-size:56px; margin-bottom:6px; }
  .end-stats{ font-size:16px; margin:14px 0 20px; line-height:1.7; }
  .end-stats b{ color:var(--orange-dark); }
  .restart-btn{
    background:var(--wood-dark); color:var(--gold); border:none; border-radius:30px;
    padding:12px 30px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #000;
  }
  .restart-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #000; }

  footer{ margin-top:22px; font-size:12px; color:#c9b89a; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Atinuke Book Club Challenge</h1>
  <div class="subtitle">Test what you know about themes, characters and books by Atinuke.</div>

  <div class="hud">
    <div class="score">⭐ Score: <span id="scoreVal">0</span></div>
    <div class="badges" id="badgesVal">📖📖📖📖📖📖📖📖</div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="shelf" id="shelf">
    <div class="status-msg" id="statusMsg">Welcome to book club!</div>
  </div>

  <div id="gameArea"></div>

  <footer>Based on "Atinuke Book Club" — Unit 1: Fiction, theme &amp; character review.</footer>
</div>

<script>
const bookColors = ['#c9436b','#1f8a83','#e8770f','#4a6fa5','#8a5a3c','#7a4d33','#b8763f','#5b8c5a'];

const questions = [
  { type:"mc",
    question:"Which theme appears in the extract from 'Too Small Tola'?",
    options:["hard work","picking palm nuts","going to school"],
    correct:"hard work" },
  { type:"mc",
    question:"What job do Tola and Dapo do to help Mr Abdul?",
    options:["They cycle to customers and take measurements.","They cook food for the festival.","They build a new house."],
    correct:"They cycle to customers and take measurements." },
  { type:"mc",
    question:"Why does Tola feel nervous while customers try on outfits?",
    options:["She worries the outfits might not fit.","She is cold.","She does not like sewing."],
    correct:"She worries the outfits might not fit." },
  { type:"mc",
    question:"Why does Mr Abdul charge the large, fancy woman more money?",
    options:["Because she was rude to Tola and Dapo.","Because her outfit used more fabric.","Because she asked for a discount."],
    correct:"Because she was rude to Tola and Dapo." },
  { type:"mc",
    question:"Atinuke says Dapo's calf muscles are 'as big as the pillars holding up the Third Mainland Bridge.' What is this an example of?",
    options:["exaggeration to show how strong he is","a literal, factual description","a joke about bridges"],
    correct:"exaggeration to show how strong he is" },
  { type:"multi",
    question:"Which of these are themes found across Atinuke's stories? Select ALL that apply.",
    hint:"Think about family, helping others and hard work across her books.",
    options:["family","helping others","hard work","cars","picking palm nuts"],
    correct:["family","helping others","hard work"] },
  { type:"mc",
    question:"How are Tola, No. 1 and Anna Hibiscus most similar?",
    options:["They like to help people.","They live in a village.","They like cars."],
    correct:"They like to help people." },
  { type:"mc",
    question:"What do we use to help choose a book to read, alongside the cover?",
    options:["the blurb","the price sticker","the page count"],
    correct:"the blurb" },
  { type:"mc",
    question:"When we have a book club discussion, what should we do?",
    options:["Respond to what others say and be polite.","Talk over other learners quickly.","Only share our own opinion."],
    correct:"Respond to what others say and be polite." },
  { type:"mc",
    question:"A good book review should explain part of the plot — but how much?",
    options:["Part of it, not all of it.","All of the ending.","None of the plot at all."],
    correct:"Part of it, not all of it." }
];

let idx = 0;
let score = 0;
let correctCount = 0;
const TOTAL = questions.length;
let answered = false;
let multiSelected = [];

const gameArea = document.getElementById('gameArea');
const scoreVal = document.getElementById('scoreVal');
const badgesVal = document.getElementById('badgesVal');
const progressFill = document.getElementById('progressFill');
const statusMsg = document.getElementById('statusMsg');
const shelf = document.getElementById('shelf');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildShelf(){
  // remove existing books
  shelf.querySelectorAll('.book').forEach(b=>b.remove());
  for(let i=0;i<TOTAL;i++){
    const b = document.createElement('div');
    b.className = 'book';
    b.style.background = bookColors[i % bookColors.length];
    b.id = 'book-'+i;
    b.textContent = (i+1);
    shelf.appendChild(b);
  }
}

function updateHud(){
  scoreVal.textContent = score;
  let badges = '';
  for(let i=0;i<TOTAL;i++){
    badges += i < idx ? (i < correctCountAt(i) ? '📗' : '📕') : '📖';
  }
  progressFill.style.width = (idx/TOTAL*100)+'%';
}

// track correctness per question index for badge rendering
let resultLog = [];
function correctCountAt(i){ return resultLog[i] ? 1 : 0; }

function refreshBadges(){
  let out = '';
  for(let i=0;i<TOTAL;i++){
    if(i < resultLog.length){
      out += resultLog[i] ? '📗' : '📕';
    } else {
      out += '📖';
    }
  }
  badgesVal.textContent = out;
}

function loadQuestion(){
  if(idx >= TOTAL){
    endGame();
    return;
  }
  answered = false;
  multiSelected = [];
  const q = questions[idx];
  statusMsg.textContent = `Book ${idx+1} of ${TOTAL}`;

  if(q.type === "mc"){
    renderMC(q);
  } else {
    renderMulti(q);
  }
  updateHud();
  refreshBadges();
}

function renderMC(q){
  const opts = shuffle(q.options);
  gameArea.innerHTML = `
    <div class="card">
      <div class="prompt-label">Book Club Question</div>
      <div class="question">${q.question}</div>
      <div class="options" id="optionsWrap">
        ${opts.map(o=>`<button class="opt" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', (e)=>onMCAnswer(e, q));
  });
}

function onMCAnswer(e, q){
  if(answered) return;
  answered = true;
  const chosen = e.target.getAttribute('data-val');
  const correct = q.correct;
  const feedback = document.getElementById('feedback');
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.getAttribute('data-val') === correct) btn.classList.add('correct');
    else if(btn === e.target) btn.classList.add('wrong');
  });

  const isCorrect = chosen === correct;
  handleResult(isCorrect, feedback, isCorrect ? "Great reading — that's right!" : `Not quite — the answer was "${correct}".`);
}

function renderMulti(q){
  gameArea.innerHTML = `
    <div class="card">
      <div class="prompt-label">Book Club Question</div>
      <div class="question">${q.question}</div>
      <div class="multi-note">${q.hint || 'Select all correct answers, then tap Check.'}</div>
      <div class="chip-row" id="chipRow">
        ${q.options.map(o=>`<button class="chip" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>
      <button class="action-btn" id="checkMultiBtn">Check answers</button>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      if(answered) return;
      const val = chip.getAttribute('data-val');
      if(multiSelected.includes(val)){
        multiSelected = multiSelected.filter(v=>v!==val);
        chip.classList.remove('selected');
      } else {
        multiSelected.push(val);
        chip.classList.add('selected');
      }
    });
  });
  document.getElementById('checkMultiBtn').addEventListener('click', ()=>checkMulti(q));
}

function checkMulti(q){
  if(answered) return;
  if(multiSelected.length === 0){
    document.getElementById('feedback').textContent = "Select at least one option first!";
    document.getElementById('feedback').className = 'feedback bad';
    return;
  }
  answered = true;
  document.getElementById('checkMultiBtn').disabled = true;
  const correctSet = new Set(q.correct);
  const chosenSet = new Set(multiSelected);
  document.querySelectorAll('.chip').forEach(chip=>{
    const val = chip.getAttribute('data-val');
    chip.classList.remove('selected');
    if(correctSet.has(val)) chip.classList.add('locked-correct');
    else if(chosenSet.has(val)) chip.classList.add('locked-wrong');
  });
  const isCorrect = correctSet.size === chosenSet.size && [...correctSet].every(v=>chosenSet.has(v));
  const feedback = document.getElementById('feedback');
  handleResult(isCorrect, feedback,
    isCorrect ? "Great reading — that's the full set!" : `Close — the correct themes were: ${q.correct.join(', ')}.`);
}

function handleResult(isCorrect, feedbackEl, message){
  resultLog[idx] = isCorrect;
  if(isCorrect){
    score += 10;
    correctCount += 1;
    feedbackEl.textContent = "📗 " + message;
    feedbackEl.className = 'feedback good';
    litBook(idx, true);
  } else {
    feedbackEl.textContent = "📕 " + message;
    feedbackEl.className = 'feedback bad';
    litBook(idx, false);
  }
  idx += 1;
  updateHud();
  refreshBadges();

  const nextBtn = document.createElement('button');
  nextBtn.className = 'action-btn';
  nextBtn.textContent = (idx >= TOTAL) ? 'See results' : 'Next book ➜';
  nextBtn.addEventListener('click', loadQuestion);
  document.querySelector('.card').appendChild(nextBtn);
}

function litBook(i, correct){
  const b = document.getElementById('book-'+i);
  if(b){
    b.classList.add('lit');
    b.style.background = correct ? '#1f8a83' : '#c9436b';
  }
}

function endGame(){
  const great = correctCount >= Math.ceil(TOTAL*0.8);
  const good = correctCount >= Math.ceil(TOTAL*0.5);
  gameArea.innerHTML = `
    <div class="end-screen">
      <div class="end-emoji">${great ? '🏆' : good ? '📚' : '🔖'}</div>
      <h2>${great ? 'Book Club Champion!' : good ? 'Great discussion!' : 'Keep reading and try again!'}</h2>
      <div class="end-stats">
        Final score: <b>${score}</b><br>
        Correct answers: <b>${correctCount} / ${TOTAL}</b>
      </div>
      <button class="restart-btn" id="restartBtn">Play again</button>
    </div>
  `;
  statusMsg.textContent = "Book club finished!";
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

function startGame(){
  idx = 0; score = 0; correctCount = 0; resultLog = [];
  buildShelf();
  loadQuestion();
}

startGame();
</script>
</body>
</html>
