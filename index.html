<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot the Stolen Cars! — Noun Phrase Game</title>
<style>
  :root{
    --navy:#0e1630;
    --navy2:#182552;
    --dock:#2f3a4d;
    --orange:#f2811b;
    --orange-dark:#c96410;
    --yellow:#ffce54;
    --red:#e0483e;
    --green:#38b06a;
    --cream:#fff8ec;
    --line:#4a5482;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 60%, var(--dock) 100%);
    color:var(--cream);
  }
  .wrap{
    max-width:740px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 16px 40px;
  }
  h1{
    font-size:clamp(21px,5vw,30px);
    margin:4px 0 2px; text-align:center; color:var(--yellow);
    text-shadow:2px 2px 0 rgba(0,0,0,0.35);
  }
  .subtitle{ color:#cfd4ea; font-size:14px; margin-bottom:14px; text-align:center; }

  .hud{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.06); border:2px solid var(--line); border-radius:14px;
    padding:10px 16px; margin-bottom:14px; font-weight:600;
  }
  .hud div{ font-size:14px; }
  .hud .score{ color:var(--yellow); }
  .hud .streak{ color:var(--green); }
  .hud .lives{ color:var(--red); font-size:18px; letter-spacing:2px; }

  .progress-bar{ width:100%; height:8px; background:rgba(255,255,255,0.15); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--orange),var(--yellow)); width:0%; transition:width .4s ease; }

  /* Port scene */
  .scene{
    position:relative; width:100%; height:130px; border-radius:16px; overflow:hidden;
    margin-bottom:18px; border:3px solid #0a0e1c;
    background: linear-gradient(180deg,#4b6fa0 0%, #7fa3cc 40%, #33404f 40%, #232d38 100%);
  }
  .ship{
    position:absolute; bottom:14px; font-size:52px;
    filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4));
  }
  .ship1{ left:6%; }
  .ship2{ left:38%; font-size:44px; opacity:0.85;}
  .ship3{ right:6%; font-size:46px; opacity:0.9;}
  .car-icon{
    position:absolute; bottom:8px; font-size:26px;
    transition: opacity 0.3s ease;
  }
  .status-msg{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); padding:4px 12px; border-radius:20px;
    font-size:12px; font-weight:700; color:var(--yellow); white-space:nowrap;
  }

  /* card */
  .card{
    width:100%; background:var(--cream); color:#26293a; border-radius:18px;
    padding:22px 20px 18px; box-shadow:0 10px 0 rgba(0,0,0,0.25); position:relative;
  }
  .prompt-label{
    font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--orange-dark); margin-bottom:8px;
  }
  .task-desc{ font-size:14px; color:#5a5f74; margin-bottom:14px; }
  .phrase-build-row{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
  }
  .slot{
    min-width:88px; min-height:46px; border:3px dashed #cfd3e0; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
    background:#f2f4fa; padding:4px 8px; color:#26293a;
  }
  .slot.filled{ border-style:solid; border-color:var(--orange); background:#fff2e0; }
  .word-bank{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px;
  }
  .word-chip{
    background:white; border:3px solid #dcdfe8; border-radius:24px; padding:9px 16px;
    font-weight:700; font-size:15px; cursor:pointer; transition:all .15s ease; color:#26293a;
  }
  .word-chip:hover:not(.used){ border-color:var(--orange); transform:translateY(-2px); }
  .word-chip.used{ opacity:0.3; cursor:default; }
  .word-chip.adj{ color:var(--orange-dark); }
  .word-chip.noun{ color:#1b6fa8; }

  .mc-question{ font-size:clamp(18px,5vw,22px); font-weight:800; margin-bottom:14px; line-height:1.3; }
  .mc-question .hl{ color:var(--orange-dark); }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px){ .options{ grid-template-columns:1fr; } }
  .opt{
    background:white; border:3px solid #dcdfe8; border-radius:12px; padding:13px 10px;
    font-size:15.5px; font-weight:700; cursor:pointer; color:#26293a; transition:all .15s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--orange); transform:translateY(-2px); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--green); border-color:var(--green); color:white; }
  .opt.wrong{ background:var(--red); border-color:var(--red); color:white; }

  .feedback{ min-height:24px; margin-top:10px; font-weight:700; font-size:14px; text-align:center; }
  .feedback.good{ color:#1b8a4f; }
  .feedback.bad{ color:#c23a30; }

  .action-btn{
    display:block; margin:14px auto 0; background:var(--orange); color:white; border:none;
    border-radius:30px; padding:10px 26px; font-size:15px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 0 var(--orange-dark);
  }
  .action-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--orange-dark); }
  .action-btn:disabled{ opacity:0.4; cursor:default; }

  .end-screen{
    width:100%; background:var(--cream); color:#26293a; border-radius:18px; padding:34px 22px;
    text-align:center; box-shadow:0 10px 0 rgba(0,0,0,0.25);
  }
  .end-screen h2{ margin-top:0; font-size:24px; color:var(--orange-dark); }
  .end-emoji{ font-size:56px; margin-bottom:6px; }
  .end-stats{ font-size:16px; margin:14px 0 20px; line-height:1.7; }
  .end-stats b{ color:var(--orange-dark); }
  .restart-btn{
    background:var(--navy); color:var(--yellow); border:none; border-radius:30px;
    padding:12px 30px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #000;
  }
  .restart-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #000; }

  footer{ margin-top:22px; font-size:12px; color:#8890ab; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚨 Spot the Stolen Cars!</h1>
  <div class="subtitle">Help No. 1 build noun phrases and spot the getaway cars before the ship sails.</div>

  <div class="hud">
    <div class="score">⭐ Score: <span id="scoreVal">0</span></div>
    <div class="streak">🔥 Streak: <span id="streakVal">0</span></div>
    <div class="lives" id="livesVal">❤❤❤</div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="scene">
    <div class="status-msg" id="statusMsg">Watching the port...</div>
    <div class="ship ship2">🚢</div>
    <div class="ship ship1">🛳️</div>
    <div class="ship ship3">🚢</div>
    <div class="car-icon" id="spottedCar" style="left:45%; opacity:0;">🚗</div>
  </div>

  <div id="gameArea"></div>

  <footer>Based on "No. 1 and the Police Chief" — Unit 1: Fiction, noun phrase practice.</footer>
</div>

<script>
// ---------- Round data ----------
// type "build": drag/click words in order (adjective[, adjective], noun) to build a phrase matching the target meaning
// type "mc": pick the correct noun phrase / adjective+noun combo for a description

const rounds = [
  { type:"build", target:"a car that has been stolen", adjOptions:["stolen","rusty","tiny"], noun:"cars", correctAdjs:["stolen"] },
  { type:"build", target:"a ship that is big and orange", adjOptions:["orange","big","quiet"], noun:"ship", correctAdjs:["big","orange"] },
  { type:"build", target:"a Firebird that is red", adjOptions:["red","broken","sleepy"], noun:"Firebird", correctAdjs:["red"] },
  { type:"build", target:"a lorry that is broken", adjOptions:["broken","yellow","loud"], noun:"lorry", correctAdjs:["broken"] },
  { type:"mc", question:"Which is a correct noun phrase describing a car in the story?",
    options:["stolen cars","cars stolen the","the of cars stolen"], correct:"stolen cars" },
  { type:"mc", question:"Which noun phrase has TWO adjectives?",
    options:["big orange ship","fast car","the ship"], correct:"big orange ship" },
  { type:"mc", question:"In 'a yellow Porsche 911', which word is the noun (the main thing being described)?",
    options:["Porsche 911","yellow","a"], correct:"Porsche 911" },
  { type:"mc", question:"Which word tells you the police are trying to stay hidden?",
    options:["crouching","shouting","driving"], correct:"crouching" },
  { type:"mc", question:"Which word means 'stops for a moment because he is not sure'?",
    options:["hesitates","scatter","squats"], correct:"hesitates" },
  { type:"mc", question:"This story has clues, a crime and a chief who solves it. What genre is it?",
    options:["detective / mystery","myth","fantasy"], correct:"detective / mystery" }
];

let order = [];
let idx = 0;
let score = 0;
let streak = 0;
let lives = 3;
const TOTAL = rounds.length;
let answered = false;
let buildState = { adjs:[], allAdjs:[] };

const gameArea = document.getElementById('gameArea');
const scoreVal = document.getElementById('scoreVal');
const streakVal = document.getElementById('streakVal');
const livesVal = document.getElementById('livesVal');
const progressFill = document.getElementById('progressFill');
const statusMsg = document.getElementById('statusMsg');
const spottedCar = document.getElementById('spottedCar');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function updateHud(){
  scoreVal.textContent = score;
  streakVal.textContent = streak;
  livesVal.textContent = '❤'.repeat(lives) + '🖤'.repeat(3-lives);
  progressFill.style.width = (idx/TOTAL*100)+'%';
}

function flashCar(found){
  spottedCar.style.opacity = found ? '1' : '0';
  spottedCar.textContent = found ? '🚔' : '🚗';
  spottedCar.style.left = (20 + Math.random()*55) + '%';
  if(found){
    setTimeout(()=>{ spottedCar.style.opacity='0'; }, 900);
  }
}

function loadRound(){
  if(idx >= TOTAL || lives <= 0){
    endGame();
    return;
  }
  answered = false;
  const r = rounds[idx];
  statusMsg.textContent = `Round ${idx+1} of ${TOTAL}`;

  if(r.type === "build"){
    buildState = { adjs: [], allAdjs: shuffle(r.adjOptions) };
    renderBuildRound(r);
  } else {
    renderMCRound(r);
  }
  updateHud();
}

function renderBuildRound(r){
  const needed = r.correctAdjs.length;
  gameArea.innerHTML = `
    <div class="card">
      <div class="prompt-label">Build the noun phrase</div>
      <div class="task-desc">Tap the adjective(s) that describe: <b>${r.target}</b>. Then tap Check.</div>
      <div class="phrase-build-row" id="slotsRow">
        ${Array.from({length:needed}).map(()=>`<div class="slot"></div>`).join('')}
        <div class="slot filled" style="background:#e9edf5;border-style:solid;border-color:#c7ccd9;">${r.noun}</div>
      </div>
      <div class="word-bank" id="wordBank">
        ${buildState.allAdjs.map(a=>`<button class="word-chip adj" data-adj="${a}">${a}</button>`).join('')}
      </div>
      <button class="action-btn" id="checkBtn">Check phrase</button>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  document.querySelectorAll('.word-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('used')) return;
      if(buildState.adjs.length >= r.correctAdjs.length) return;
      buildState.adjs.push(chip.getAttribute('data-adj'));
      chip.classList.add('used');
      renderSlots(r);
    });
  });
  document.getElementById('checkBtn').addEventListener('click', ()=>checkBuild(r));
}

function renderSlots(r){
  const slots = document.querySelectorAll('#slotsRow .slot');
  buildState.adjs.forEach((a,i)=>{
    if(slots[i]){
      slots[i].textContent = a;
      slots[i].classList.add('filled');
    }
  });
}

function checkBuild(r){
  if(answered) return;
  if(buildState.adjs.length < r.correctAdjs.length){
    document.getElementById('feedback').textContent = "Choose the right number of adjectives first!";
    document.getElementById('feedback').className = 'feedback bad';
    return;
  }
  answered = true;
  const chosenSet = new Set(buildState.adjs);
  const correctSet = new Set(r.correctAdjs);
  const isCorrect = chosenSet.size === correctSet.size && [...chosenSet].every(a => correctSet.has(a));
  const feedback = document.getElementById('feedback');
  document.getElementById('checkBtn').disabled = true;

  if(isCorrect){
    score += 10 + streak*2;
    streak += 1;
    feedback.textContent = `🚔 Spotted! "${r.correctAdjs.join(' ')} ${r.noun}" is correct.`;
    feedback.className = 'feedback good';
    flashCar(true);
  } else {
    streak = 0;
    lives -= 1;
    feedback.textContent = `Not quite — the phrase should be "${r.correctAdjs.join(' ')} ${r.noun}".`;
    feedback.className = 'feedback bad';
    flashCar(false);
  }
  finishRound();
}

function renderMCRound(r){
  const opts = shuffle(r.options);
  gameArea.innerHTML = `
    <div class="card">
      <div class="prompt-label">Spot the answer</div>
      <div class="mc-question">${r.question}</div>
      <div class="options" id="optionsWrap">
        ${opts.map(o=>`<button class="opt" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', (e)=>onMCAnswer(e, r));
  });
}

function onMCAnswer(e, r){
  if(answered) return;
  answered = true;
  const chosen = e.target.getAttribute('data-val');
  const correct = r.correct;
  const feedback = document.getElementById('feedback');
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.getAttribute('data-val') === correct) btn.classList.add('correct');
    else if(btn === e.target) btn.classList.add('wrong');
  });

  if(chosen === correct){
    score += 10 + streak*2;
    streak += 1;
    feedback.textContent = "🚔 Spotted! That's the one.";
    feedback.className = 'feedback good';
    flashCar(true);
  } else {
    streak = 0;
    lives -= 1;
    feedback.textContent = `Not quite — the answer was "${correct}".`;
    feedback.className = 'feedback bad';
    flashCar(false);
  }
  finishRound();
}

function finishRound(){
  idx += 1;
  updateHud();
  statusMsg.textContent = lives > 0 ? "Keep watching..." : "Losing them!";
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action-btn';
  nextBtn.textContent = (idx >= TOTAL || lives <= 0) ? 'See results' : 'Next round ➜';
  nextBtn.addEventListener('click', loadRound);
  document.querySelector('.card').appendChild(nextBtn);
}

function endGame(){
  const won = lives > 0;
  gameArea.innerHTML = `
    <div class="end-screen">
      <div class="end-emoji">${won ? '🏆' : '🚢'}</div>
      <h2>${won ? 'HANDS UP! You caught the car thieves!' : 'The ship sailed away...'}</h2>
      <div class="end-stats">
        Final score: <b>${score}</b><br>
        Rounds completed: <b>${idx} / ${TOTAL}</b><br>
        Lives remaining: <b>${lives}</b>
      </div>
      <button class="restart-btn" id="restartBtn">Play again</button>
    </div>
  `;
  statusMsg.textContent = won ? "Case closed!" : "Ship departed";
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

function startGame(){
  score = 0; streak = 0; lives = 3; idx = 0;
  spottedCar.style.opacity = '0';
  loadRound();
}

startGame();
</script>
</body>
</html>
